[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beer-timeseries"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "seaborn", "statsmodels", "plotly", "pyreadr"]

[project.optional-dependencies]
forecast = ["torch", "chronos-forecasting", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]
